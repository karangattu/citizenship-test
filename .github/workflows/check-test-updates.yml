name: Check USCIS civics source

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the tracked USCIS PDF
        id: source
        run: |
          set -euo pipefail
          URL=$(node -p "require('./scripts/uscis-source.json').url")
          EXPECTED=$(node -p "require('./scripts/uscis-source.json').sha256")
          OUT="$RUNNER_TEMP/uscis.pdf"

          # uscis.gov sits behind Akamai, which answers 403 to every request from a
          # GitHub-hosted runner (even the site root), so a direct curl can never
          # succeed here. Try it anyway, then fall back to the newest Internet
          # Archive copy of the same file.
          if curl -fsSL --retry 2 --max-time 120 "$URL" -o "$OUT"; then
            SOURCE="live"
          else
            echo "Live download failed; falling back to the Internet Archive."
            SNAPSHOT=$(curl -fsSL --max-time 90 \
              "https://web.archive.org/cdx/search/cdx?url=$URL&fl=timestamp&filter=statuscode:200&limit=-1" \
              | tail -n 1)
            if [ -z "$SNAPSHOT" ]; then
              echo "::error::No Internet Archive snapshot of $URL is available."
              exit 1
            fi
            curl -fsSL --retry 2 --max-time 180 \
              "https://web.archive.org/web/${SNAPSHOT}id_/$URL" -o "$OUT"
            SOURCE="Internet Archive snapshot $SNAPSHOT"
          fi

          ACTUAL=$(sha256sum "$OUT" | awk '{print $1}')
          echo "Checked $URL via $SOURCE"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update a tracking issue
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ steps.source.outputs.expected }}
          ACTUAL: ${{ steps.source.outputs.actual }}
          SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          TITLE="USCIS civics test source changed"
          URL=$(node -p "require('./scripts/uscis-source.json').url")
          BODY=$(cat <<EOF
          The USCIS PDF at the tracked URL no longer matches the verified checksum.

          - Source: $URL
          - Downloaded from: $SOURCE
          - Expected sha256: \`$EXPECTED\`
          - Downloaded sha256: \`$ACTUAL\`

          Next steps:
          1. Compare the new PDF with \`questions.js\`.
          2. Update any changed questions or dynamic answers (President, Vice President, Speaker, Chief Justice).
          3. Update \`scripts/uscis-source.json\` with the new checksum and date.
          4. Check https://www.uscis.gov/citizenship/find-study-materials-and-resources/check-for-test-updates
          EOF
          )
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
