name: probe uscis download

on:
  push:
    branches: [ci/uscis-download-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Response headers and body
        run: |
          URL="https://www.uscis.gov/sites/default/files/document/questions-and-answers/2025-Civics-Test-128-Questions-and-Answers.pdf"
          echo "=== headers ==="
          curl -sS -D - -o /tmp/body.txt --max-time 60 "$URL" | head -25 || true
          echo "=== body (first 600 chars) ==="
          head -c 600 /tmp/body.txt || true
          echo
          echo "=== root domain ==="
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 60 "https://www.uscis.gov/" || true
          echo "=== archive.org reachable ==="
          curl -sS -o /dev/null -w "%{http_code}\n" --max-time 60 "https://web.archive.org/" || true
          echo "=== wayback cdx latest snapshot ==="
          curl -sS --max-time 90 "https://web.archive.org/cdx/search/cdx?url=uscis.gov/sites/default/files/document/questions-and-answers/2025-Civics-Test-128-Questions-and-Answers.pdf&output=json&limit=-3&filter=statuscode:200" || true
