name: probe uscis download

on:
  push:
    branches: [ci/uscis-download-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try several request shapes
        run: |
          URL="https://www.uscis.gov/sites/default/files/document/questions-and-answers/2025-Civics-Test-128-Questions-and-Answers.pdf"
          PAGE="https://www.uscis.gov/citizenship/find-study-materials-and-resources/check-for-test-updates"
          UA_BROWSER="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"

          code() { curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$@" || true; }

          echo "plain            : $(code "$URL")"
          echo "browser-ua       : $(code -A "$UA_BROWSER" "$URL")"
          echo "full-headers     : $(code -A "$UA_BROWSER" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,application/pdf,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Sec-Fetch-Dest: document' \
            -H 'Sec-Fetch-Mode: navigate' \
            -H 'Sec-Fetch-Site: none' \
            -H 'Sec-Fetch-User: ?1' \
            -H 'Upgrade-Insecure-Requests: 1' \
            "$URL")"
          echo "html-page        : $(code -A "$UA_BROWSER" "$PAGE")"
          echo "html-page-plain  : $(code "$PAGE")"
          echo "curl-head        : $(code -I "$URL")"
          echo "ipv4             : $(code -4 "$URL")"
